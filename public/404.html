<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>ElectroKW S.A.S.</title>
    <!--
      Redirección SPA para GitHub Pages (rafgraph/spa-github-pages).
      Repo tipo "usuario.github.io" (raíz, sin subpath) -> pathSegmentsToKeep = 0.
      Si el repo cambiara a uno con nombre propio, este valor debe pasar a 1.
    -->
    <script type="text/javascript">
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname
            .split("/")
            .slice(0, 1 + pathSegmentsToKeep)
            .join("/") +
          "/?/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(pathSegmentsToKeep)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
